<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A small dependency-free painting tool: pick a color, size the brush, and draw on a canvas.">
    <title>Canvas Paint</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main class="app">
      <header class="app__header">
        <h1>Paint Your Own Picture</h1>
        <p class="app__tagline">Pick a color, size the brush, and draw. Nothing leaves your browser.</p>
      </header>

      <div class="surface-frame">
        <canvas id="surface" aria-label="Drawing canvas"></canvas>
      </div>

      <div class="toolbar">
        <fieldset class="tool-group">
          <legend>Brush</legend>
          <div class="field">
            <label for="color">Color</label>
            <input type="color" id="color" value="#000000">
          </div>
          <div class="field">
            <label for="size">Size</label>
            <input type="range" id="size" min="1" max="80" step="1" value="12">
            <output id="size-output" for="size">12</output>
            <span class="brush-preview" id="brush-preview" aria-hidden="true"></span>
          </div>
        </fieldset>

        <fieldset class="tool-group">
          <legend>Canvas size</legend>
          <div class="field">
            <label for="canvas-width">Width</label>
            <input type="number" id="canvas-width" min="120" max="2400" step="10" inputmode="numeric">
          </div>
          <div class="field">
            <label for="canvas-height">Height</label>
            <input type="number" id="canvas-height" min="120" max="2400" step="10" inputmode="numeric">
          </div>
        </fieldset>

        <fieldset class="tool-group tool-group--actions">
          <legend>Actions</legend>
          <button type="button" id="undo" disabled>Undo</button>
          <button type="button" id="clear">Clear</button>
          <button type="button" id="save">Save PNG</button>
        </fieldset>
      </div>

      <p class="hints">
        <kbd>Ctrl</kbd>+<kbd>Z</kbd> undo &middot; <kbd>[</kbd> and <kbd>]</kbd> change brush size
      </p>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </main>

    <script src="./script.js" defer></script>
  </body>
</html>
